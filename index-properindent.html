<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Training Module</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Design tokens */
:root {
  --p: #5b3cf0;
  --pd: #4a2fd1;
  --pt: #eeebff;
  --ink: #1a1d29;
  --m: #5f6577;
  --b: #e2e5ee;
  --bg: #f3f4f8;
  --ok: #17803d;
  --okb: #e2f5e8;
  --wn: #945200;
  --wnb: #fdf0d3;
  --er: #b42318;
  --erb: #fde7e4;
  --r: 10px;
}

/* Base */
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font: 14px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

h1,h2,h3 {
  line-height: 1.25;
  letter-spacing: -.01em;
}

h2 {
  font-size: 24px;
  margin: 0 0 4px;
}

h3 {
  font-size: 17px;
  margin: 22px 0 10px;
}

/* Header and navigation */
header {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 24px;
  background: #fff;
  border-bottom: 1px solid var(--b);
  padding: 0 24px;
  min-height: 60px;
  flex-wrap: wrap;
}

header>b {
  font-size: 18px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 9px;
}

header>b:before {
  content: "";
  width: 24px;
  height: 24px;
  border-radius: 7px;
  background: linear-gradient(135deg,var(--p),#9a7bff);
}

nav {
  display: flex;
  gap: 4px;
  flex: 1;
  flex-wrap: wrap;
}

nav a,nav span {
  padding: 8px 12px;
  border-radius: 8px;
  font-weight: 500;
}

nav a {
  cursor: pointer;
  font-weight: 600;
  color: var(--ink);
  transition: background .15s;
}

nav a:hover {
  background: var(--bg);
}

nav a.on {
  background: var(--pt);
  color: var(--p);
}

.dis {
  color: #a2a8b8;
}

.who {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
}

.av {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--pt);
  color: var(--p);
  display: grid;
  place-items: center;
  font-weight: 700;
}

/* Layout and cards */
main {
  max-width: 1180px;
  margin: 0 auto;
  padding: 28px 24px 56px;
}

.card {
  background: #fff;
  border: 1px solid var(--b);
  border-radius: var(--r);
  padding: 20px;
  margin-bottom: 16px;
}

.card>b:first-child {
  display: block;
  font-size: 15px;
  margin-bottom: 6px;
}

.row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}

.sp {
  justify-content: space-between;
}

.grid {
  display: grid;
  gap: 16px;
}

.g4 {
  grid-template-columns: repeat(auto-fit,minmax(200px,1fr));
}

.g3 {
  grid-template-columns: repeat(auto-fit,minmax(290px,1fr));
}

.two {
  grid-template-columns: 2fr 1fr;
  align-items: start;
}

@media(max-width:860px) {
  .two {
    grid-template-columns: 1fr;
  }
  header {
    padding: 8px 16px;
  }
  main {
    padding: 20px 16px 40px;
  }
}

/* Summary stats */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(150px,1fr));
  background: #fff;
  border: 1px solid var(--b);
  border-radius: var(--r);
  margin-bottom: 16px;
}

.stat {
  padding: 16px 20px;
  border-left: 1px solid var(--b);
}

.stat:first-child {
  border-left: 0;
}

.sv {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -.02em;
  line-height: 1.2;
}

/* Forms and buttons */
input,select,textarea {
  padding: 9px 11px;
  border: 1px solid #cdd1de;
  border-radius: 8px;
  font: inherit;
  width: 100%;
  background: #fff;
  color: var(--ink);
  transition: border-color .15s,box-shadow .15s;
}

input:focus,select:focus,textarea:focus,button:focus-visible,nav a:focus-visible {
  outline: 0;
  border-color: var(--p);
  box-shadow: 0 0 0 3px #5b3cf033;
}

.row input,.row select {
  width: auto;
}

input[type=checkbox],input[type=radio] {
  width: auto;
  accent-color: var(--p);
}

input:disabled,select:disabled,textarea:disabled {
  background: #f1f2f6;
  color: #8a90a2;
  cursor: not-allowed;
}

label {
  display: block;
  font-weight: 600;
  font-size: 13px;
  margin: 14px 0 5px;
}

label:first-child {
  margin-top: 0;
}

button {
  padding: 9px 16px;
  border-radius: 8px;
  border: 1px solid var(--p);
  background: var(--p);
  color: #fff;
  cursor: pointer;
  font: inherit;
  font-weight: 600;
  transition: background .15s,border-color .15s;
}

button:hover {
  background: var(--pd);
}

button.g {
  background: #fff;
  color: var(--ink);
  border-color: #cdd1de;
}

button.g:hover {
  background: var(--bg);
}

button.r {
  background: #fff;
  color: var(--er);
  border-color: #f2b8b2;
}

button.r:hover {
  background: var(--erb);
}

button.sm {
  padding: 5px 11px;
  font-size: 13px;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

/* Tables */
.tbl {
  overflow: auto;
  padding: 0;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th,td {
  text-align: left;
  padding: 12px 14px;
  border-bottom: 1px solid var(--b);
  vertical-align: middle;
}

th {
  color: var(--m);
  font-size: 13px;
  font-weight: 600;
  background: #fafbfd;
  white-space: nowrap;
}

tr:last-child td {
  border-bottom: 0;
}

tbody tr:hover td {
  background: #fafbff;
}

td .row {
  flex-wrap: nowrap;
}

/* Progress bars and status tags */
.bar {
  height: 6px;
  background: #e6e8f0;
  border-radius: 99px;
  overflow: hidden;
  min-width: 70px;
}

.bar i {
  display: block;
  height: 100%;
  background: var(--p);
  border-radius: 99px;
}

.tag {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 99px;
  font-size: 12px;
  font-weight: 600;
  background: #eef0f5;
  color: #4a5064;
  margin: 2px;
}

.Published,.Completed,.Active {
  background: var(--okb);
  color: var(--ok);
}

.Draft,.Not {
  background: #eef0f5;
  color: #4a5064;
}

.Archived,.Inactive {
  background: var(--erb);
  color: var(--er);
}

.In {
  background: var(--wnb);
  color: var(--wn);
}

.red {
  color: var(--er);
  font-weight: 600;
}

.m {
  color: var(--m);
}

/* Course cards */
.th {
  height: 140px;
  background: linear-gradient(135deg,#d9d2ff,#f0ecff);
  overflow: hidden;
}

.th img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.cc {
  padding: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.cb {
  padding: 16px 18px 18px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1;
}

.cb>b {
  font-size: 16px;
}

.cb p {
  margin: 0;
}

.cb .row {
  margin-top: auto;
  padding-top: 6px;
}

/* Modals, breadcrumbs and login */
.ov {
  position: fixed;
  inset: 0;
  background: #141a2e80;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9;
  padding: 12px;
}

.box {
  background: #fff;
  border-radius: 14px;
  padding: 24px;
  width: 500px;
  max-width: 100%;
  max-height: 90vh;
  overflow: auto;
  box-shadow: 0 20px 50px #0003;
}

.box h3 {
  margin-top: 0;
}

.pg button {
  margin: 0 2px;
  padding: 5px 11px;
}

.crumb {
  color: var(--m);
  margin-bottom: 12px;
  font-size: 13px;
}

.crumb a {
  color: var(--p);
  cursor: pointer;
  font-weight: 600;
}

.login {
  max-width: 400px;
  margin: 12vh auto;
  padding: 32px;
  box-shadow: 0 12px 40px #1a1d2914;
}

.login h1 {
  font-size: 26px;
  margin: 0 0 4px;
}

.ic {
  position: relative;
}

.ic span {
  position: absolute;
  left: 11px;
  top: 9px;
}

.ic input {
  padding-left: 36px;
}

.err {
  color: var(--er);
  margin: 8px 0;
  min-height: 20px;
}

.login button {
  width: 100%;
  padding: 11px;
}

small {
  font-size: 12px;
}

iframe,video {
  border-radius: 8px;
  background: #000;
}

.bar+div {
  margin-top: 6px;
}

/* Icons */
.i {
  flex: none;
  vertical-align: -3px;
}

.ni,nav a {
  display: inline-flex;
  align-items: center;
  gap: 7px;
}

.ic span {
  color: var(--m);
  display: flex;
  top: 11px;
}

/* Course page: card headers, lists and assessment */
.hd {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin: -20px -20px 4px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--b);
}

.hd b {
  font-size: 15px;
}

.li {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 2px;
  border-bottom: 1px solid var(--b);
  cursor: pointer;
  color: var(--ink);
  font-weight: 500;
}

.li:last-child {
  border-bottom: 0;
}

.li:hover {
  color: var(--p);
}

.li .i {
  color: var(--p);
}

.li .tag {
  margin-left: auto;
}

.sec {
  padding: 14px 0 2px;
  border-bottom: 1px solid var(--b);
}

.sec:last-child {
  border-bottom: 0;
}

.st {
  font-weight: 700;
  margin-bottom: 2px;
}

.qb {
  padding: 16px 0;
  border-bottom: 1px solid var(--b);
}

.qh {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}

.op {
  display: flex;
  gap: 10px;
  align-items: center;
  font-weight: 400;
  font-size: 14px;
  margin: 6px 0;
  padding: 9px 12px;
  border: 1px solid var(--b);
  border-radius: 8px;
  cursor: pointer;
}

.op:has(input:checked) {
  border-color: var(--p);
  background: var(--pt);
}

.op:has(input:disabled) {
  cursor: not-allowed;
  opacity: .6;
}

.ft {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-top: 16px;
  flex-wrap: wrap;
}

.ft .m {
  margin-right: auto;
}

.res {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 16px 0;
  border-bottom: 1px solid var(--b);
  flex-wrap: wrap;
}

.note {
  display: flex;
  gap: 10px;
  align-items: center;
  background: var(--wnb);
  color: var(--wn);
  padding: 10px 12px;
  border-radius: 8px;
  margin: 14px 0 0;
  font-weight: 500;
}

.note.er {
  background: var(--erb);
  color: var(--er);
}

.rv .qb:last-child {
  border-bottom: 0;
}

/* Loading spinner */
.boot {
  min-height: 100vh;
  display: grid;
  place-items: center;
}

.spin {
  width: 34px;
  height: 34px;
  border: 3px solid var(--pt);
  border-top-color: var(--p);
  border-radius: 50%;
  animation: sp .8s linear infinite;
}

@keyframes sp {
  to {
    transform: rotate(360deg);
  }
}

@media(prefers-reduced-motion:reduce) {
  .spin {
    animation-duration: 2.4s;
  }
}
</style>
</head>
<body>
  <div id="app"><div class=boot><span class=spin></span></div></div><div id="m"></div>
<script type="module">
// ===== Firebase SDK =====
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,createUserWithEmailAndPassword}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection,doc,getDoc,getDocs,setDoc,addDoc,updateDoc,deleteDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// === PASTE YOUR PORTAL'S FIREBASE CONFIG ===
// Firebase project settings (the web API key is public by design; Firestore rules protect the data)
const cfg={apiKey:"AIzaSyBqZbnp5nmqzNLNg3xYHoYfSKpf3wOgoOY",authDomain:"e-portal-812b5.firebaseapp.com",projectId:"e-portal-812b5",storageBucket:"e-portal-812b5.firebasestorage.app",messagingSenderId:"565851579739",appId:"1:565851579739:web:d30b847872a3534c48e67e" };
// Firebase app, auth and Firestore handles
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
// ===== App state =====
// U users | C courses | E enrollments | K categories | PG page toggles
// me signed-in user | S current view | F course filters | SEL selected rows | P table page
// D course being edited | BF browse filters
let U=[],C=[],E=[],K=[],PG={},me=null,S={v:'login'},F={q:'',cat:'All',st:'All',df:'All',sort:'mod'},SEL=new Set,P=1,D=null,BF={q:'',cat:'All'};
// ===== Constants and helpers =====
// Audit-log entries kept per course
const LOGMAX=10;
// Inline SVG icons: ic(name, size, tooltip)
const IC={"home":"<path d=\"M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z\"/>","users":"<circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M1 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2M16 3.1a4 4 0 0 1 0 7.8M23 21v-2a4 4 0 0 0-3-3.9\"/>","news":"<path d=\"M4 4h13a2 2 0 0 1 2 2v14H6a2 2 0 0 1-2-2z\"/><path d=\"M8 8h7M8 12h7M8 16h4\"/>","mic":"<rect x=\"9\" y=\"2\" width=\"6\" height=\"12\" rx=\"3\"/><path d=\"M5 11a7 7 0 0 0 14 0M12 18v4\"/>","lock":"<rect x=\"4\" y=\"11\" width=\"16\" height=\"10\" rx=\"2\"/><path d=\"M8 11V7a4 4 0 0 1 8 0v4\"/>","mega":"<path d=\"M3 11v2a1 1 0 0 0 1 1h3l7 4V6L7 10H4a1 1 0 0 0-1 1z\"/><path d=\"M18 9a4 4 0 0 1 0 6\"/>","cap":"<path d=\"M22 9L12 4 2 9l10 5z\"/><path d=\"M6 11v5c3 2.5 9 2.5 12 0v-5\"/>","cog":"<circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2\"/>","mail":"<rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M3 7l9 6 9-6\"/>","user":"<circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4 21a8 8 0 0 1 16 0\"/>","check":"<path d=\"M5 13l4 4L19 7\"/>","done":"<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M8 12l3 3 5-6\"/>","play":"<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M10 8l6 4-6 4z\"/>","clock":"<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/>","trash":"<path d=\"M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3\"/>","x":"<path d=\"M6 6l12 12M18 6L6 18\"/>","edit":"<path d=\"M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z\"/>"},ic=(n,z=16,t='')=>`<svg class=i width=${z} height=${z} viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2 stroke-linecap=round stroke-linejoin=round role=img aria-label="${t||n}">${t?`<title>${t}</title>`:''}${IC[n]}</svg>`;
// Attempt-policy settings (also reads the old single 'policy' field) and attempts used
const pcfg=c=>({show:c.showAns!==undefined?!!c.showAns:c.policy=='show',unl:c.unlimited!==undefined?!!c.unlimited:(c.policy===undefined||c.policy=='unlimited'),max:+c.maxAttempts||0}),attemptsOf=e=>e.attempts||(e.attempted?1:0);
// A holds every handler called from inline onclick attributes
// $ = querySelector, esc = HTML-escape, isAdm = Admin or Super Admin
const A=window.A={},$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isAdm=()=>me&&me.role!='Employee',now=()=>Date.now(),dt=n=>n?new Date(n).toLocaleDateString():'-';
const get=n=>getDocs(collection(db,n)).then(s=>s.docs.map(d=>({id:d.id,...d.data()})));
const modal=h=>$('#m').innerHTML=h?`<div class=ov><div class=box>${h}</div></div>`:'';
A.close=()=>modal('');
// Load every collection from Firestore
async function load(){
  [U,C,E,K]=await Promise.all(['users','courses','enrollments','categories'].map(get));
  const p=await getDoc(doc(db,'settings','pages'));
  PG=p.exists()?p.data():{}
}
// Navigate to a view, reload data, then redraw
A.go=async(v,a)=>{
  S={v,a};
  if(v!='login')await load();
  draw()
};
// Copy form fields (data-k) into the course being edited
const sy=()=>document.querySelectorAll('[data-k]').forEach(e=>{
  if(!e.disabled)D[e.dataset.k]=e.dataset.k=='pass'?+e.value:e.value
});
// Render the current view into #app
const draw=()=>{
  if(S.v=='edit'&&D)sy();
  $('#app').innerHTML=S.v=='login'?loginH():nav()+'<main>'+({admin:adminH,mt:mtH,edit:editH,emp:empH,my:myH,browse:browseH,course:courseH}[S.v])()+'</main>'
};
window.draw=draw;
window.BF=BF;
Object.defineProperty(window,'D',{get:()=>D,set:v=>{
  D=v
}});
// Course progress: every material plus the assessment counts as one step
// Materials are identified by 'sectionIndex.materialIndex'
const mats=c=>(c.sections||[]).flatMap((s,i)=>(s.mats||[]).map((m,j)=>({...m,id:i+'.'+j})));
const pr=(e,c)=>{
  const ids=mats(c).map(m=>m.id),q=(c.questions||[]).length,t=ids.length+(q?1:0);
  if(!t)return 0;
  const d=(e.viewed||[]).filter(x=>ids.includes(x)).length+(q&&e.passed?1:0);
  return d>=t?100:Math.min(99,Math.round(d/t*100))
};
const stt=(e,c)=>{
  const p=pr(e,c);
  return p==100?'Completed':(p>0||e.attempted)?'In Progress':'Not Started'
};
// Small UI helpers: status class, progress bar, breadcrumb, select box
const cls=s=>s.split(' ')[0],bar=p=>`<div class=bar><i style="width:${p}%"></i></div>`;
const crumb=(...a)=>`<div class=crumb>${a.map(([t,v])=>v?`<a onclick="A.go('${v}')">${t}</a>`:t).join(' &gt; ')}</div>`;
const sel=(id,opts,val,ch)=>`<select ${id?`id=${id}`:''} onchange="${ch}">${opts.map(o=>`<option ${o==val?'selected':''}>${esc(o)}</option>`).join('')}</select>`;

/* LOGIN */
const loginH=()=>`<div class="card login"><h1>Welcome back</h1><p class=m style="margin:0 0 20px">Sign in to your portal account.</p><div class=ic><span>${ic('mail')}</span><input id=em type=email placeholder=Email></div><br><div class=ic><span>${ic('lock')}</span><input id=pw type=password placeholder=Password></div><div class=err id=er>${S.err||''}</div><button style="width:100%" onclick="A.login()">Sign in</button></div>`;
A.login=async()=>{
  const e=$('#em').value.trim(),p=$('#pw').value;
  if(!/^[^\s@]+@[^\s@]+\.[A-Za-z]{2,}$/.test(e))return $('#er').textContent='Enter a valid email (needs "@" and a domain like .co or .my).';
  try{
    await signInWithEmailAndPassword(auth,e,p)
  } catch{
    $('#er').textContent='Invalid email or password.'
  }
};
A.out=()=>signOut(auth);
// Runs on page load and on sign-in/sign-out
onAuthStateChanged(auth,async u=>{
  try{
    await ab(u)
  } catch(x){
    S={v:'login',err:'Signed in, but loading failed: '+x.message};
    draw()
  }
});
// Create the profile if missing, block inactive users, then route by role
const ab=async u=>{
  if(!u){
    me=null;
    S.v='login';
    return draw()
  }
  const r=doc(db,'users',u.uid),s=await getDoc(r);
  if(!s.exists())await setDoc(r,{email:u.email,name:u.email.split('@')[0],role:'Employee',status:'Active'});
  me={uid:u.uid,email:u.email,...(s.exists()?s.data():{name:u.email.split('@')[0],role:'Employee',status:'Active'})};
  if(me.status=='Inactive'){
    S.err='Your account is inactive.';
    return signOut(auth)
  }
  S.err='';

  } catch(x){
    console.error(x);
    alert('Save failed: '+(x.message||x))
  }

A.sv2=async st=>{
  sy();
// Publish uses the Set Status dropdown only if it was changed; Save Draft always stays Draft
  const tgt=(st=='Published'&&D.touched)?D.setStatus:st;
  if(tgt!='Draft'){
    const L={title:'Course Title',desc:'Course Description',category:'Category',thumb:'Course Thumbnail',duration:'Estimated Duration',difficulty:'Difficulty Level'},bad=Object.keys(L).filter(k=>!String(D[k]||'').trim()).map(k=>L[k]);
    if(!(D.pass>=1&&D.pass<=100))bad.push('Passing Threshold (1-100)');
    if(D.questions.length&&!D.unlimited&&!(+D.maxAttempts>=1))bad.push('Max Attempts');
    if(bad.length){
      D.err=bad;
      draw();
      scrollTo(0,0);
      alert('Please fill in: '+bad.join(', '));
      return
    }
    D.err=null
  }
// Build the document to store (drop UI-only fields, normalise attempt policy)
  const d={...D};
  delete d.err;
  delete d.touched;
  delete d.setStatus;
  delete d.policy;
  delete d.max;
  d.unlimited=!!D.unlimited;
  d.showAns=!!D.showAns;
  d.maxAttempts=D.unlimited?'':(+D.maxAttempts||'');
  if(!String(d.title||'').trim())d.title='Untitled draft';
  const prev=D.status;
  d.status=tgt;
  d.wasPub=!!D.wasPub||tgt!='Draft';
  delete d.id;
  d.modified=now();
  d.created=D.created||now();
  d.lastEditedBy=me.name;
  d.lastEditedAt=d.modified;
// Audit log keeps the latest LOGMAX entries
  d.log=[...(D.log||[]),{by:me.name,uid:me.uid,at:d.modified,act:(D.id?'Edited':'Created')+' · '+(D.id&&prev!=tgt?prev+' → '+tgt:tgt)}].slice(-LOGMAX);
  if(!D.id){
    d.trainerId=me.uid;
    d.trainerName=me.name;
    d.trainerDesig=me.designation||'';
    d.trainerDept=me.department||''
  }
  let id=D.id;
  if(id)await setDoc(doc(db,'courses',id),d);
  else id=(await addDoc(collection(db,'courses'),d)).id;
// Private + Published: create enrollments for assigned employees who don't have one
  if(d.vis=='private'&&d.status=='Published')for(const a of d.assigned)if(!E.some(e=>e.id==a.uid+'_'+id))await setDoc(doc(db,'enrollments',a.uid+'_'+id),{uid:a.uid,courseId:id,assignedBy:d.trainerName||me.name,viewed:[]});
  A.go('mt')
};

/* MANAGE EMPLOYEES */
// Employee list and add/edit/delete
const empH=()=>`${crumb(['Admin','admin'],['Manage Employees'])}<div class="row sp"><h2>Manage Employees</h2><button onclick="A.em()">Add employee</button></div><div class="card tbl"><table><tr><th>Name<th>Email<th>Designation<th>Phone<th>Department<th>Role<th>Status<th>Actions</tr>${U.map(u=>`<tr><td>${esc(u.name)}<td>${esc(u.email)}<td>${esc(u.designation)}<td>${esc(u.phone)}<td>${esc(u.department)}<td>${u.role}<td><span class="tag ${u.status}">${u.status}</span><td><div class=row><button class="g sm" onclick="A.ev('${u.id}')">View</button><button class="g sm" onclick="A.em('${u.id}')">Edit</button><button class="r sm" onclick="A.ed('${u.id}')">Delete</button></div></tr>`).join('')}</table></div>`;
const ext=u=>`<label>Designation</label><input id=ds value="${esc(u.designation)}"><label>Phone Number</label><input id=ph value="${esc(u.phone)}"><label>Department</label><input id=dp value="${esc(u.department)}"><label>Role</label>${sel('rl',['Employee','Admin','Super Admin'],u.role||'Employee','')}<label>Status</label>${sel('sx',['Active','Inactive'],u.status||'Active','')}`;
let EID=null;
A.em=id=>{
  EID=id;
  const u=id?U.find(x=>x.id==id):null;
  modal(`<h3>${u?'Edit':'Add'} Employee</h3><label>Name</label><input id=nm value="${esc(u?.name)}">${u?`<label>Email</label><input value="${esc(u.email)}" disabled>`:`<label>Email</label><input id=ea type=email><label>Password</label><input id=ps type=password>`}<div id=x>${u?ext(u):''}</div><br><button id=sv onclick="A.${u?'su':'ce'}()">${u?'Save':'Create account'}</button> <button class=g onclick="A.close();A.go('emp')">Close</button>`)
};
A.ce=async()=>{
  const n=$('#nm').value.trim(),e=$('#ea').value.trim(),p=$('#ps').value;
  if(!n||!/^[^\s@]+@[^\s@]+\.[A-Za-z]{2,}$/.test(e)||p.length<6)return alert('Enter name, a valid email and a password (min 6 chars).');
  try{
    const s2=initializeApp(cfg,'sec'+now()),a2=getAuth(s2),c=await createUserWithEmailAndPassword(a2,e,p);
    await setDoc(doc(db,'users',c.user.uid),{name:n,email:e,role:'Employee',status:'Active'});
    await signOut(a2);
    EID=c.user.uid
  } catch(x){
    return alert(x.message)
  }
  $('#x').innerHTML=ext({});
  $('#sv').textContent='Save details';
  $('#sv').setAttribute('onclick','A.su()')
};
A.su=async()=>{
  const d={designation:$('#ds').value,phone:$('#ph').value,department:$('#dp').value,role:$('#rl').value,status:$('#sx').value};
  if($('#nm'))d.name=$('#nm').value;
  await updateDoc(doc(db,'users',EID),d);
  A.close();
  A.go('emp')
};
A.ev=id=>{
  const u=U.find(x=>x.id==id);
  modal(`<h3>${esc(u.name)}</h3><p>Email: ${esc(u.email)}</p><p>Phone: ${esc(u.phone)||'-'}</p><p>Designation: ${esc(u.designation)||'-'}</p><p>Department: ${esc(u.department)||'-'}</p><button class=g onclick="A.close()">Close</button>`)
};
A.ed=async id=>{
  if(confirm('Delete this employee?')&&confirm('Are you sure? This cannot be undone.')){
    await deleteDoc(doc(db,'users',id));
    A.go('emp')
  }
};

/* EMPLOYEE: MY TRAINING */
// Enrollments of the signed-in user for published courses
const mine=()=>E.filter(e=>e.uid==me.uid).map(e=>({e,c:C.find(c=>c.id==e.courseId)})).filter(x=>x.c&&x.c.status=='Published');
const due=(e,c)=>e.due||c.deadline,over=(e,c,s)=>due(e,c)&&s!='Completed'&&new Date(due(e,c))<new Date();
const contH=l=>`<h3>Continue training</h3><div class="grid g3">${l.filter(({e,c})=>stt(e,c)!='Completed').sort((a,b)=>(b.e.last||0)-(a.e.last||0)).slice(0,3).map(({e,c})=>{const p=pr(e,c);return `<div class="card cc"><div class=th>${c.thumb?`<img src="${esc(c.thumb)}" alt="" loading=lazy onerror="this.remove()">`:''}</div><div class=cb><b>${esc(c.title)}</b><div class=m>${p}% complete</div>${bar(p)}<div style="margin:8px 0">${(c.tags||[]).map(t=>`<span class=tag>${esc(t)}</span>`).join('')}</div><button onclick="A.open('${c.id}')">${p>0?'Resume Course':'Start Course'}</button>${e.assignedBy=='Self-assigned'?` <button class=r onclick="A.un('${c.id}')">Unassign</button>`:''}</div></div>`}).join('')||'<span class=m>Nothing in progress.</span>'}</div>`;
const myH=()=>{
  const l=mine(),n=s=>l.filter(({e,c})=>stt(e,c)==s).length,d=n('Completed');
  return `<div class="row sp"><div><h2 style="margin:0">My Training</h2><div class=m>Track and complete your learning courses</div></div><button onclick="A.go('browse')">Browse Training</button></div><br><div class=stats>${[['Completed',d],['In Progress',n('In Progress')],['Not Started',n('Not Started')],['Completion Rate',(l.length?Math.round(d/l.length*100):0)+'%']].map(([t,v,i])=>`<div class=stat><div class=m>${t}</div><div class=sv>${v}</div></div>`).join('')}</div>${contH(l)}
<h3>Assigned Training</h3><div class="card tbl"><table><tr><th>Title<th>Assigned By<th>Status<th>Due</tr>${l.map(({e,c})=>{const s=stt(e,c);return `<tr><td><a style="cursor:pointer;color:var(--p)" onclick="A.open('${c.id}')">${esc(c.title)}</a><td>${esc(e.assignedBy)}<td><span class="tag ${cls(s)}">${s}</span><td class="${over(e,c,s)?'red':''}">${due(e,c)||'-'}</tr>`}).join('')||'<tr><td colspan=4 class=m>No assigned courses</td></tr>'}</table></div>`
};
const browseH=()=>{
  const l=mine(),q=BF.q.toLowerCase(),r=C.filter(c=>c.status=='Published'&&c.vis=='public'&&(!q||c.title.toLowerCase().includes(q))&&(BF.cat=='All'||c.category==BF.cat));
  return `${crumb(['My Training','my'],['Browse Training'])}<h2>Browse Public Course</h2><div class=row><input style="width:260px" placeholder="Search title" value="${esc(BF.q)}" onchange="BF.q=this.value;draw()">${sel('',['All',...K.map(k=>k.name)],BF.cat,"BF.cat=this.value;draw()")}</div><br><div class="grid g3">${r.map(c=>`<div class="card cc"><div class=th>${c.thumb?`<img src="${esc(c.thumb)}" alt="" loading=lazy onerror="this.remove()">`:''}</div><div class=cb><b>${esc(c.title)}</b><p class=m>${esc(c.desc)}</p>${(()=>{const x=l.find(x=>x.c.id==c.id);return x?`<button class=g onclick="A.open('${c.id}')">Open</button>${x.e.assignedBy=='Self-assigned'?` <button class=r onclick="A.un('${c.id}')">Unassign</button>`:''}`:`<button onclick="A.me('${c.id}')">Assign to Me</button>`})()}<div class=m style="font-size:12px">${mats(c).length} materials · ${esc(c.duration)}</div></div></div>`).join('')||'<span class=m>No public courses.</span>'}</div>${contH(l)}`
};
BF.cat='All';
// Self-assign a public course / unassign it (own data is deleted)
A.me=async id=>{
  const c=C.find(x=>x.id==id);
  await setDoc(doc(db,'enrollments',me.uid+'_'+id),{uid:me.uid,courseId:id,assignedBy:'Self-assigned',viewed:[]});
  A.go('browse')
};
// Unassign asks for double confirmation
A.un=async id=>{
  const c=C.find(x=>x.id==id);
  if(!confirm(`Unassign "${c?c.title:'this course'}"?\n\nYour progress, viewed materials, answers and score will be permanently deleted.`))return;
  if(!confirm('Are you sure? This cannot be undone and your data will not be kept.'))return;
  try{
    await deleteDoc(doc(db,'enrollments',me.uid+'_'+id));
    A.go(S.v=='my'?'my':'browse')
  } catch(x){
    console.error(x);
    alert('Unassign failed: '+(x.message||x))
  }
};

/* COURSE PAGE */
// Open a course page (restores previous answers if any)
A.open=async id=>{
  try{
    await load();
    const e=E.find(x=>x.id==me.uid+'_'+id);
    S={v:'course',a:id,m:null,ans:{...(e?.answers||{})},qm:e&&e.attempted?'result':'take',rv:false};
    draw()
  } catch(x){
    console.error(x);
    alert('Could not open course: '+(x.message||x))
  }
};
const viewer=m=>{
  if(!m)return '<div class=m style="padding:40px;text-align:center">Select a material to view</div>';
  const u=m.url;
  return /\.(mp4|webm|mov)(\?|$)/i.test(u)?`<video src="${esc(u)}" controls style="width:100%"></video>`:/\.pptx?(\?|$)/i.test(u)?`<iframe src="https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(u)}" style="width:100%;height:480px;border:0"></iframe>`:`<iframe src="${esc(u)}" style="width:100%;height:480px;border:0"></iframe>`
};
// Course page: viewer, materials, assessment, trainer and lessons
const courseH=()=>{
  const c=C.find(x=>x.id==S.a),e=E.find(x=>x.id==me.uid+'_'+S.a);
  if(!c||!e||c.status!='Published')return '<p>Course not available.</p>';
  const s=stt(e,c),M=mats(c),cur=M.find(m=>m.id==S.m),qs=c.questions||[];
  S.ans=S.ans||{};
  return `${crumb(['My Training','my'],[esc(c.title)])}<div class="row sp"><h2>${esc(c.title)}</h2><span class="tag ${cls(s)}">${s}</span></div><div class=card>${viewer(cur)}</div>
<div class="grid two"><div><div class=card><b>Overview</b><p>${esc(c.desc)}</p></div><div class=card><div class=hd><b>Materials</b><span class=m>${M.filter(m=>(e.viewed||[]).includes(m.id)).length} of ${M.length} viewed</span></div>${M.map(m=>`<a class=li onclick="A.mat('${m.id}')">${ic((e.viewed||[]).includes(m.id)?'done':'play',18)}<span>${esc(m.name)}</span></a>`).join('')||'<span class=m>No materials</span>'}</div>
${qs.length?assessH(c,e):''}</div>
<div><div class=card><b>Trainer</b><p>${esc(c.trainerName)}<br><span class=m>${esc(c.trainerDesig)} · ${esc(c.trainerDept)}</span></p></div><div class=card><div class=hd><b>Course Lessons</b></div>${(c.sections||[]).map((sc,i)=>`<div class=sec><div class=st>${esc(sc.title)}</div>${sc.mats.map((m,j)=>`<a class=li onclick="A.mat('${i}.${j}')">${ic((e.viewed||[]).includes(i+'.'+j)?'check':'play',16)}<span>${esc(m.name)}</span>${m.tag?`<span class=tag>${esc(m.tag)}</span>`:''}</a>`).join('')}</div>`).join('')}</div></div></div>`
};
// Mark a material as viewed and save progress
A.mat=async id=>{
  S.m=id;
  const e=E.find(x=>x.id==me.uid+'_'+S.a);
  if(!(e.viewed||[]).includes(id)){
    const pv=e.viewed||[];
    e.viewed=[...pv,id];
    e.last=now();
    try{
      await updateDoc(doc(db,'enrollments',e.id),{viewed:e.viewed,last:e.last})
    } catch(x){
      e.viewed=pv;
      console.error(x);
      alert('Could not save progress: '+(x.message||x))
    }
  }
  draw()
};
// Scoring and answer review
const score=c=>{
  const qs=c.questions;
  let g=0,t=0;
  qs.forEach((q,i)=>{
    t+=q.marks;
    if(S.ans[i]===q.ans)g+=q.marks
  });
  return[g,t]
};
A.an=(i,j)=>{
  S.ans[i]=j;
  const c=C.find(x=>x.id==S.a);
  $('#sum').textContent=`${Object.keys(S.ans).length} of ${c.questions.length} answered`
};
const review=(c,ans,showC)=>c.questions.map((q,i)=>{
  const a=ans[i];
  return `<div class=qb><div class=qh><b>${i+1}. ${esc(q.q)}</b><span class=m>${q.marks} mark${q.marks==1?'':'s'}</span></div>${q.opts.map((o,j)=>{let st='',tx='';if(j===a){const good=a===q.ans;st=good?'background:#dcfce7;color:#166534':'background:#fee2e2;color:#991b1b';tx=good?ic('check',14)+' Your answer (correct)':ic('x',14)+' Your answer (wrong)'}else if(showC&&j===q.ans){st='border:1px dashed #166534;color:#166534';tx=ic('check',14)+' Correct answer'}return `<div style="padding:6px 8px;margin:4px 0;border-radius:6px;border:1px solid transparent;${st}">${esc(o)}<small>${tx}</small></div>`}).join('')}</div>`
}).join('');
// Assessment card: locked until all materials are viewed, then take / result / review
const assessH=(c,e)=>{
  const qs=c.questions,p=pcfg(c),at=attemptsOf(e),lim=!p.unl&&p.max>0?p.max:Infinity,tot=qs.reduce((s,q)=>s+(+q.marks||0),0),M=mats(c),vw=M.filter(m=>(e.viewed||[]).includes(m.id)).length,lock=vw<M.length;
  const hd=x=>`<div class=hd><b>Assessment Questions</b><span class=m>Pass mark ${c.pass}%${x||''}</span></div>`;
  if((S.qm||'take')=='take')return `<div class=card>${hd(lim<Infinity?` · Attempt ${Math.min(at+1,lim)} of ${lim}`:'')}${lock?`<div class=note>${ic('lock')}<span>Locked. View all ${M.length} materials to unlock the assessment (${vw} of ${M.length} viewed).</span></div>`:''}${qs.map((q,i)=>`<div class=qb><div class=qh><b>${i+1}. ${esc(q.q)}</b><span class=m>${q.marks} mark${q.marks==1?'':'s'}</span></div>${q.opts.map((o,j)=>`<label class=op><input type=radio name=q${i} ${S.ans[i]===j?'checked':''} ${lock?'disabled':''} onchange="A.an(${i},${j})"> ${esc(o)}</label>`).join('')}</div>`).join('')}<div class=ft><span id=sum class=m>${Object.keys(S.ans).length} of ${qs.length} answered</span><button ${lock?'disabled':''} onclick="A.sub()">Submit</button></div></div>`;
  const g=e.score||0,ok=!!e.passed,all=g>=tot,out=at>=lim;
  return `<div class=card>${hd()}<div class=res><div><div class=sv>${g}/${tot}</div><span class=m>Total score</span></div><span class="tag ${ok?'Published':'Archived'}">${ok?'PASSED':'TRY AGAIN'}</span>${lim<Infinity?`<span class=m>Attempts used ${Math.min(at,lim)} of ${lim}</span>`:''}</div>${!ok&&out?'<div class="note er">Please contact Admin to reassign this course.</div>':''}<div class=ft><button class=g onclick="A.vw()">${S.rv?'Hide Answer':'View Answer'}</button><button ${all||out?'disabled':''} onclick="A.rt()">Retake</button></div>${S.rv?`<div class=rv>${review(c,e.answers||{},p.show)}</div>`:''}</div>`
};
// Submit: checks materials viewed, attempt limit and all answered, then stores the result
A.sub=async()=>{
  const c=C.find(x=>x.id==S.a),e=E.find(x=>x.id==me.uid+'_'+S.a),n=c.questions.length,p=pcfg(c),at=attemptsOf(e);
  if(mats(c).some(m=>!(e.viewed||[]).includes(m.id)))return alert('View all course materials before taking the assessment.');
  if(!p.unl&&p.max>0&&at>=p.max)return alert('You have used all attempts. Please contact Admin to reassign this course.');
  if(Object.keys(S.ans).length<n)return alert('Please answer all questions.');
  const[g,t]=score(c),ok=Math.round(g/t*100)>=c.pass,ans={...S.ans},na=at+1,l=now();
  try{
    await updateDoc(doc(db,'enrollments',e.id),{answers:ans,score:g,passed:ok,attempted:true,attempts:na,last:l});
    Object.assign(e,{answers:ans,score:g,passed:ok,attempted:true,attempts:na,last:l});
    S.qm='result';
    S.rv=false;
    draw()
  } catch(x){
    console.error(x);
    alert('Submit failed: '+(x.message||x))
  }
};
// Retake and show/hide answers
A.rt=()=>{
  const c=C.find(x=>x.id==S.a),e=E.find(x=>x.id==me.uid+'_'+S.a),p=pcfg(c),tot=c.questions.reduce((s,q)=>s+(+q.marks||0),0);
  if((e.score||0)>=tot||(!p.unl&&p.max>0&&attemptsOf(e)>=p.max))return;
  S.ans={};
  S.qm='take';
  S.rv=false;
  draw()
};
A.vw=()=>{
  S.rv=!S.rv;
  draw()
};
</script>
</body>
