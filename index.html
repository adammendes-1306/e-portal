<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Training Module</title>
<style>
:root{--p:#6d4aff;--b:#e5e7eb;--m:#6b7280}*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;color:#111827;background:#f6f7fb}
header{display:flex;align-items:center;gap:16px;background:#fff;border-bottom:1px solid var(--b);padding:10px 20px;flex-wrap:wrap}nav{display:flex;gap:14px;flex:1;flex-wrap:wrap}nav a,nav span{padding:6px 10px;border-radius:6px}nav a{cursor:pointer;font-weight:600}nav a.on{background:#ede9fe;color:var(--p)}.dis{color:#b0b5c0}
main{max-width:1150px;margin:0 auto;padding:20px}.card{background:#fff;border:1px solid var(--b);border-radius:10px;padding:16px;margin-bottom:14px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.two{grid-template-columns:2fr 1fr}@media(max-width:800px){.two{grid-template-columns:1fr}}
input,select,textarea{padding:8px;border:1px solid #d1d5db;border-radius:6px;font:inherit;width:100%}.row input,.row select{width:auto}input[type=checkbox],input[type=radio]{width:auto}label{display:block;font-weight:600;margin:10px 0 4px}
button{padding:8px 14px;border-radius:6px;border:1px solid var(--p);background:var(--p);color:#fff;cursor:pointer;font:inherit}button.g{background:#fff;color:#111827;border-color:#d1d5db}button.r{background:#fff;color:#dc2626;border-color:#fca5a5}button:disabled{opacity:.4;cursor:not-allowed}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--b)}th{color:var(--m);font-size:12px;text-transform:uppercase}.bar{height:6px;background:#e5e7eb;border-radius:4px;overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:var(--p)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:#f3f4f6;margin:2px}.Published,.Completed,.Active{background:#dcfce7;color:#166534}.Draft,.Not{background:#f3f4f6}.Archived,.Inactive{background:#fee2e2;color:#991b1b}.In{background:#fef3c7;color:#92400e}.red{color:#dc2626;font-weight:600}.m{color:var(--m)}
.ov{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:9;padding:10px}.box{background:#fff;border-radius:10px;padding:20px;width:480px;max-width:100%;max-height:90vh;overflow:auto}
.pg button{margin:0 2px;padding:4px 10px}.crumb{color:var(--m);margin-bottom:10px}.crumb a{color:var(--p);cursor:pointer}.login{max-width:380px;margin:12vh auto}.ic{position:relative}.ic span{position:absolute;left:9px;top:9px}.ic input{padding-left:32px}.err{color:#dc2626;margin:6px 0}
</style></head><body><div id="app"></div><div id="m"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,createUserWithEmailAndPassword}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection,doc,getDoc,getDocs,setDoc,addDoc,updateDoc,deleteDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
// === PASTE YOUR PORTAL'S FIREBASE CONFIG ===
const cfg={
  apiKey:"AIzaSyBqZbnp5nmqzNLNg3xYHoYfSKpf3wOgoOY",
  authDomain:"e-portal-812b5.firebaseapp.com",
  projectId:"e-portal-812b5",
  storageBucket:"e-portal-812b5.firebasestorage.app",
  messagingSenderId:"565851579739",
  appId:"1:565851579739:web:d30b847872a3534c48e67e"
};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
let U=[],C=[],E=[],K=[],PG={},me=null,S={v:'login'},F={q:'',cat:'All',st:'All',df:'All',sort:'mod'},SEL=new Set,P=1,D=null,BF={q:'',cat:'All'};
const LOGMAX=10;
const pcfg=c=>({show:c.showAns!==undefined?!!c.showAns:c.policy=='show',unl:c.unlimited!==undefined?!!c.unlimited:(c.policy===undefined||c.policy=='unlimited'),max:+c.maxAttempts||0}),attemptsOf=e=>e.attempts||(e.attempted?1:0);
const A=window.A={},$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isAdm=()=>me&&me.role!='Employee',now=()=>Date.now(),dt=n=>n?new Date(n).toLocaleDateString():'-';
const get=n=>getDocs(collection(db,n)).then(s=>s.docs.map(d=>({id:d.id,...d.data()})));
const modal=h=>$('#m').innerHTML=h?`<div class=ov><div class=box>${h}</div></div>`:'';A.close=()=>modal('');
async function load(){[U,C,E,K]=await Promise.all(['users','courses','enrollments','categories'].map(get));const p=await getDoc(doc(db,'settings','pages'));PG=p.exists()?p.data():{}}
A.go=async(v,a)=>{S={v,a};if(v!='login')await load();draw()};
const sy=()=>document.querySelectorAll('[data-k]').forEach(e=>{if(!e.disabled)D[e.dataset.k]=e.dataset.k=='pass'?+e.value:e.value});
const draw=()=>{if(S.v=='edit'&&D)sy();$('#app').innerHTML=S.v=='login'?loginH():nav()+'<main>'+({admin:adminH,mt:mtH,edit:editH,emp:empH,my:myH,browse:browseH,course:courseH}[S.v])()+'</main>'};
window.draw=draw;window.BF=BF;Object.defineProperty(window,'D',{get:()=>D,set:v=>{D=v}});
const mats=c=>(c.sections||[]).flatMap((s,i)=>(s.mats||[]).map((m,j)=>({...m,id:i+'.'+j})));
const pr=(e,c)=>{const t=mats(c).length;return t?Math.min(100,Math.round((e.viewed||[]).length/t*100)):0};
const stt=(e,c)=>{const p=pr(e,c),q=(c.questions||[]).length;return p==100&&(!q||e.passed)?'Completed':(p>0||e.attempted)?'In Progress':'Not Started'};
const cls=s=>s.split(' ')[0],bar=p=>`<div class=bar><i style="width:${p}%"></i></div>`;
const crumb=(...a)=>`<div class=crumb>${a.map(([t,v])=>v?`<a onclick="A.go('${v}')">${t}</a>`:t).join(' &gt; ')}</div>`;
const sel=(id,opts,val,ch)=>`<select ${id?`id=${id}`:''} onchange="${ch}">${opts.map(o=>`<option ${o==val?'selected':''}>${esc(o)}</option>`).join('')}</select>`;

/* LOGIN */
const loginH=()=>`<div class="card login"><h1 style="margin:0">Welcome to Portal</h1><p class=m>Sign in to continue</p><div class=ic><span>✉️</span><input id=em type=email placeholder=Email></div><br><div class=ic><span>🔒</span><input id=pw type=password placeholder=Password></div><div class=err id=er>${S.err||''}</div><button style="width:100%" onclick="A.login()">Sign in</button></div>`;
A.login=async()=>{const e=$('#em').value.trim(),p=$('#pw').value;if(!/^[^\s@]+@[^\s@]+\.[A-Za-z]{2,}$/.test(e))return $('#er').textContent='Enter a valid email (needs "@" and a domain like .co or .my).';
try{await signInWithEmailAndPassword(auth,e,p)}catch{$('#er').textContent='Invalid email or password.'}};
A.out=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{try{await ab(u)}catch(x){S={v:'login',err:'Signed in, but loading failed: '+x.message};draw()}});
const ab=async u=>{if(!u){me=null;S.v='login';return draw()}
const r=doc(db,'users',u.uid),s=await getDoc(r);if(!s.exists())await setDoc(r,{email:u.email,name:u.email.split('@')[0],role:'Employee',status:'Active'});
me={uid:u.uid,email:u.email,...(s.exists()?s.data():{name:u.email.split('@')[0],role:'Employee',status:'Active'})};
if(me.status=='Inactive'){S.err='Your account is inactive.';return signOut(auth)}S.err='';await A.go(isAdm()?'admin':'my')};
const nav=()=>`<header><b>Portal</b><nav>${['🏠 Home','👥 HR','📰 Article','🎤 Sessions','🔒 ISO 27001','📢 Townhall'].map(x=>`<span class=dis>${x}</span>`).join('')}<a class="${/my|browse|course/.test(S.v)?'on':''}" onclick="A.go('my')">🎓 Training</a>${isAdm()?`<a class="${/admin|mt|edit|emp/.test(S.v)?'on':''}" onclick="A.go('admin')">⚙️ Admin</a>`:''}</nav><span>${esc(me.name)} <button class=g onclick="A.out()">Sign out</button></span></header>`;

/* ADMIN PANEL */
const adminH=()=>`<h2>Admin Panel</h2><div class=card><b>Page Management</b>${['Home','HR','Article','Sessions','ISO 27001','Townhall','Training'].map(p=>`<div class="row sp" style="padding:6px 0"><span>${p}</span><input type=checkbox ${PG[p]!==false?'checked':''} onchange="A.pg('${p}',this.checked)"></div>`).join('')}</div>
<h3>Quick Actions</h3><div class="grid g3"><div class=card style="cursor:pointer" onclick="A.go('mt')">📚 <b>Manage Training</b><div class=m>Create and manage courses</div></div>${me.role=='Super Admin'?`<div class=card style="cursor:pointer" onclick="A.go('emp')">👤 <b>Manage Employees</b><div class=m>Accounts, roles and status</div></div>`:''}</div>`;
A.pg=async(p,v)=>{PG[p]=v;await setDoc(doc(db,'settings','pages'),PG)};

/* MANAGE TRAINING */
const vis=()=>C.filter(c=>c.status!='Draft'||c.trainerId==me.uid);
const rows=()=>vis().filter(c=>{const q=F.q.toLowerCase();return(!q||[c.title,c.category,c.trainerName].some(x=>(x||'').toLowerCase().includes(q)))&&(F.cat=='All'||c.category==F.cat)&&(F.st=='All'||c.status==F.st)&&(F.df=='All'||c.difficulty==F.df)}).sort((a,b)=>F.sort=='mod'?b.modified-a.modified:a.created-b.created);
const mtH=()=>{const r=rows(),pg=r.slice((P-1)*8,P*8),n=Math.ceil(r.length/8)||1,one=SEL.size==1,cn=s=>vis().filter(c=>c.status==s).length;
return `${crumb(['Admin','admin'],['Manage Training'])}<div class="row sp"><h2>Manage Training</h2><button onclick="A.new()">+ Add new course</button></div>
<div class="grid g4">${[['Total Course',vis().length,'#ede9fe','📚'],['Published',cn('Published'),'#dcfce7','✅'],['Draft',cn('Draft'),'#f3f4f6','📝'],['Archived',cn('Archived'),'#fee2e2','📦']].map(([t,v,b,i])=>`<div class="card row sp" style="background:${b}"><div><div class=m>${t}</div><h2 style="margin:4px 0">${v}</h2></div><span style="font-size:26px">${i}</span></div>`).join('')}</div>
<div class="card row"><input placeholder="Search title, category or instructor" value="${esc(F.q)}" onchange="A.f('q',this.value)" style="width:260px">${sel('',['All',...K.map(k=>k.name)],F.cat,"A.f('cat',this.value)")}${sel('',['All','Published','Draft','Archived'],F.st,"A.f('st',this.value)")}${sel('',['All','Beginner','Intermediate','Advanced'],F.df,"A.f('df',this.value)")}<select onchange="A.f('sort',this.value)"><option value=mod ${F.sort=='mod'?'selected':''}>Last Modified</option><option value=cr ${F.sort=='cr'?'selected':''}>Created At</option></select></div>
<div class="card row"><span>${SEL.size} course(s) selected</span><select ${one?'':'disabled'} onchange="A.cs(this.value)"><option value="">Change Status</option>${['Published','Draft','Archived'].map(s=>`<option>${s}</option>`).join('')}</select><button class=g ${SEL.size?'':'disabled'} onclick="A.exp()">🖨 Export</button>|<button class=r ${SEL.size?'':'disabled'} onclick="A.delSel()">🗑 Delete Selected</button></div>
<div class=card style="overflow:auto"><table><tr><th><input type=checkbox onchange="A.all(this.checked)" ${pg.length&&pg.every(c=>SEL.has(c.id))?'checked':''}></th><th>Title</th><th>Category</th><th>Trainer</th><th>Status</th><th>Difficulty</th><th>Enrolled</th><th>Completion</th><th>Last Modified</th><th>Actions</th></tr>
${pg.map(c=>{const en=E.filter(e=>e.courseId==c.id),d=en.filter(e=>stt(e,c)=='Completed').length,p=en.length?Math.round(d/en.length*100):0;return `<tr><td><input type=checkbox ${SEL.has(c.id)?'checked':''} onchange="A.sl('${c.id}')"></td><td>${esc(c.title)}</td><td>${esc(c.category)}</td><td>${esc(c.trainerName)}</td><td><span class="tag ${c.status}">${c.status}</span></td><td>${c.difficulty}</td><td>${en.length}</td><td>${p}%${bar(p)}</td><td>${dt(c.modified)}<br><small class=m>${esc(c.lastEditedBy)}</small></td><td><button class=g onclick="A.edit('${c.id}')">✏️</button> <button class=r onclick="A.del('${c.id}')">🗑</button></td></tr>`}).join('')||'<tr><td colspan=10 class=m>No courses</td></tr>'}</table>
<div class="row sp" style="margin-top:10px"><span class=m>Showing ${r.length?(P-1)*8+1:0}-${Math.min(P*8,r.length)} of ${r.length} courses</span><span class=pg>${Array.from({length:n},(_,i)=>`<button class="${i+1==P?'':'g'}" onclick="A.pgo(${i+1})">${i+1}</button>`).join('')}</span></div></div>`};
A.f=(k,v)=>{F[k]=v;P=1;draw()};A.pgo=i=>{P=i;draw()};A.sl=id=>{SEL.has(id)?SEL.delete(id):SEL.add(id);draw()};
A.all=v=>{rows().slice((P-1)*8,P*8).forEach(c=>v?SEL.add(c.id):SEL.delete(c.id));draw()};
A.cs=async s=>{if(!s)return;const id=[...SEL][0],c=C.find(x=>x.id==id),t=now();await updateDoc(doc(db,'courses',id),{status:s,wasPub:s!='Draft'||!!c.wasPub,modified:t,lastEditedBy:me.name,lastEditedAt:t,log:[...(c.log||[]),{by:me.name,uid:me.uid,at:t,act:'Status changed to '+s}].slice(-LOGMAX)});
if(s=='Published'&&c.vis=='private')for(const a of c.assigned||[])if(!E.some(e=>e.id==a.uid+'_'+id))await setDoc(doc(db,'enrollments',a.uid+'_'+id),{uid:a.uid,courseId:id,assignedBy:c.trainerName||me.name,viewed:[]});A.go('mt')};
A.exp=()=>{const w=open('');w.document.write(`<h3>Training Export</h3><table border=1 cellpadding=6 style="border-collapse:collapse"><tr><th>Title<th>Category<th>Trainer<th>Status<th>Difficulty<th>Enrolled<th>Last Modified</tr>${C.filter(c=>SEL.has(c.id)).map(c=>`<tr><td>${esc(c.title)}<td>${esc(c.category)}<td>${esc(c.trainerName)}<td>${c.status}<td>${c.difficulty}<td>${E.filter(e=>e.courseId==c.id).length}<td>${dt(c.modified)}`).join('')}</table>`);w.print()};
const rm=async id=>{await deleteDoc(doc(db,'courses',id));await Promise.all(E.filter(e=>e.courseId==id).map(e=>deleteDoc(doc(db,'enrollments',e.id))));SEL.delete(id)};
A.del=async id=>{if(confirm('Delete this course?')){await rm(id);A.go('mt')}};
A.delSel=async()=>{if(confirm(`Delete ${SEL.size} course(s)?`)){await Promise.all([...SEL].map(rm));A.go('mt')}};

/* ADD / EDIT COURSE */
A.new=()=>{D={title:'',desc:'',category:'',thumb:'',duration:'',difficulty:'Beginner',sections:[],questions:[],unlimited:true,showAns:false,maxAttempts:'',pass:70,vis:'public',assigned:[],deadline:'',status:'Draft',setStatus:'Published',tags:[],notes:''};A.go('edit')};
A.edit=id=>{D=JSON.parse(JSON.stringify(C.find(c=>c.id==id)));D.setStatus=D.status;const pc=pcfg(D);D.unlimited=pc.unl;D.showAns=pc.show;D.maxAttempts=D.maxAttempts||'';delete D.policy;delete D.max;A.go('edit')};
const iv=(k,ph,t='text')=>`<input data-k=${k} type=${t} placeholder="${ph||''}" value="${esc(D[k])}" oninput="D.${k}=this.value">`;
const editH=()=>`${crumb(['Admin','admin'],['Manage Training','mt'],['Add New Course'])}<div class="row sp"><h2>${D.id?'Edit':'Create New'} Training <span class="tag ${D.status}">${D.status}</span></h2><div class=row><button class=g onclick="A.save('Draft')">Save Draft</button><button onclick="A.save('Published')">Publish Course</button></div></div>${D.err?`<div class=card style="border-color:#fca5a5;background:#fef2f2;color:#991b1b"><b>Please fill in the required fields:</b> ${D.err.join(', ')}</div>`:''}
<div class="grid two"><div>
<div class=card><b>Course Details</b><label>Course Title *</label>${iv('title')}<label>Course Description * (max 300)</label><textarea data-k=desc maxlength=300 rows=3 oninput="D.desc=this.value">${esc(D.desc)}</textarea>
<label>Category *</label><div class=row><select data-k=category oninput="D.category=this.value"><option value="">Select...</option>${K.map(k=>`<option ${k.name==D.category?'selected':''}>${esc(k.name)}</option>`).join('')}</select><button class=g onclick="A.cats()">Add / edit categories</button></div>
<label>Course Thumbnail * (image URL; keep file ≤ 5 MB)</label>${iv('thumb','https://...')}<label>Estimated Duration *</label>${iv('duration','e.g. 3 hours')}<label>Difficulty *</label><select data-k=difficulty>${['Beginner','Intermediate','Advanced'].map(o=>`<option ${o==D.difficulty?'selected':''}>${o}</option>`).join('')}</select></div>
<div class=card><div class="row sp"><b>Course Lessons</b><button class=g onclick="A.sm()">+ Add Section</button></div>${D.sections.map((s,i)=>`<div class=card style="background:#fafafa"><div class=row><input style="flex:1" placeholder="Section title" value="${esc(s.title)}" oninput="D.sections[${i}].title=this.value"><button class=r onclick="A.ds(${i})">🗑</button></div>${s.mats.map((m,j)=>`<div class="row sp" style="margin-top:6px"><span>${esc(m.name)} ${m.tag?`<span class=tag>${esc(m.tag)}</span>`:''}<br><small class=m>${esc(m.url)}</small></span><button class=r onclick="A.dm(${i},${j})">x</button></div>`).join('')}<button class=g style="margin-top:8px" onclick="A.mm(${i})">+ Add material</button></div>`).join('')}</div>
<div class=card><b>Assessment Questions</b><label>Attempt Policy</label><label style="font-weight:400"><input type=checkbox ${D.unlimited?'checked':''} onchange="A.ul(this.checked)"> Unlimited attempts until all correct</label><label style="font-weight:400"><input type=checkbox ${D.showAns?'checked':''} onchange="A.sa(this.checked)"> Show correct answers after first complete attempt</label><label>Max Attempts</label><input id=mx data-k=maxAttempts type=number min=1 ${D.unlimited?'disabled':''} placeholder="Number of attempts allowed" value="${D.maxAttempts}" oninput="D.maxAttempts=this.value">
<label>Passing Threshold % (1-100)</label><input data-k=pass type=number min=1 max=100 value="${D.pass}" oninput="D.pass=+this.value">
${D.questions.map((q,i)=>`<div class="row sp" style="padding:8px 0;border-bottom:1px solid var(--b)"><span>${i+1}. ${esc(q.q)} <span class=tag>${q.type} · ${q.marks} mark(s)</span></span><button class=r onclick="A.dq(${i})">🗑</button></div>`).join('')}<div style="margin-top:10px"><b>Total Marks: ${D.questions.reduce((s,q)=>s+(+q.marks||0),0)}</b> <span class=m>(${D.questions.length} question${D.questions.length==1?'':'s'})</span></div><button style="margin-top:10px" onclick="A.qm()">+ Add Question</button></div></div>
<div><div class=card><b>Visibility and Access</b><label style="font-weight:400"><input type=radio name=vis ${D.vis=='public'?'checked':''} onchange="A.vis('public')"> Public Course – employees can self-assign</label><label style="font-weight:400"><input type=radio name=vis ${D.vis=='private'?'checked':''} onchange="A.vis('private')"> Private Course – only assigned employees</label>
<label>Assign to Employees</label><input id=asg ${D.vis=='private'?'':'disabled'} placeholder="Search any employee, admin or super admin" oninput="A.fs(this.value)"><div id=res></div><div id=asl>${D.assigned.map((a,i)=>`<span class=tag>${esc(a.name)} <a style="cursor:pointer" onclick="A.da(${i})">✕</a></span>`).join('')}</div></div>
<div class=card><b>Course Settings</b><label>Enrollment Deadline (optional)</label>${iv('deadline','','date')}</div>
<div class=card><b>Set Status</b><br>${(()=>{const en=D.wasPub||(D.id&&D.status!='Draft');return `<select ${en?'':'disabled'} onchange="D.setStatus=this.value;D.touched=true">${['Draft','Published','Archived'].map(o=>`<option ${o==(en?D.setStatus:'Draft')?'selected':''}>${o}</option>`).join('')}</select>${en?'':'<div class=m style="margin-top:6px">Available after the course is published.</div>'}`})()}</div>
<div class=card><b>Course Tags</b><div class=row style="margin-top:8px"><input id=tg placeholder="Tag"><button onclick="A.tag()">Add</button></div><div id=tgl>${tagsH()}</div></div>
<div class=card><b>Notes For Trainers</b><textarea data-k=notes rows=3 oninput="D.notes=this.value">${esc(D.notes)}</textarea></div>${auditH()}</div></div>`;
const ts=n=>new Date(n).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
const auditH=()=>`<div class=card><b>Audit Log</b> <span class=m>(latest ${LOGMAX})</span>${D.id?`<div class=m style="margin:6px 0">Created by ${esc(D.trainerName)} · ${ts(D.created)}<br>Last edited by ${esc(D.lastEditedBy||D.trainerName)} · ${ts(D.lastEditedAt||D.modified)}</div>${(D.log||[]).slice(-LOGMAX).reverse().map(l=>`<div style="padding:4px 0;border-top:1px solid var(--b);font-size:12px"><b>${esc(l.by)}</b> – ${esc(l.act)}<br><span class=m>🕒 ${ts(l.at)}</span></div>`).join('')}`:'<div class=m style="margin-top:6px">Not saved yet.</div>'}</div>`;
const tagsH=()=>D.tags.map((t,i)=>`<span class=tag>${esc(t)} <a style="cursor:pointer" onclick="A.td(${i})">✕</a></span>`).join('');
A.tag=()=>{const i=$('#tg'),v=i.value.trim();if(v&&!D.tags.includes(v))D.tags.push(v);i.value='';$('#tgl').innerHTML=tagsH()};
A.td=i=>{D.tags.splice(i,1);$('#tgl').innerHTML=tagsH()};
A.da=i=>{D.assigned.splice(i,1);draw()};A.ds=i=>{D.sections.splice(i,1);draw()};A.dm=(i,j)=>{D.sections[i].mats.splice(j,1);draw()};A.dq=i=>{D.questions.splice(i,1);draw()};
const mf=()=>`<label>Course Lesson Title</label><input id=lt><label>Material (PDF / PPTX / video URL, max 5 MB)</label><input id=mu placeholder="https://..."><label>Lesson Tag</label><input id=lg placeholder="e.g. Basics">`;
const gm=()=>{const n=$('#lt').value.trim(),u=$('#mu').value.trim();if(!n||!u){alert('Enter the lesson title and material.');return null}return{name:n,url:u,tag:$('#lg').value.trim()}};
A.sm=()=>modal(`<h3>Add Section</h3><label>Section Title</label><input id=st placeholder="e.g. Introduction">${mf()}<br><br><button onclick="A.ss()">Add</button> <button class=g onclick="A.close()">Cancel</button>`);
A.ss=()=>{const t=$('#st').value.trim();if(!t)return alert('Enter a section title.');const m=gm();if(!m)return;D.sections.push({title:t,mats:[m]});A.close();draw()};
A.mm=i=>modal(`<h3>Add Material</h3>${mf()}<br><br><button onclick="A.ms(${i})">Add</button> <button class=g onclick="A.close()">Cancel</button>`);
A.ms=i=>{const m=gm();if(!m)return;D.sections[i].mats.push(m);A.close();draw()};
A.vis=v=>{D.vis=v;const i=$('#asg');i.disabled=v!='private';if(v!='private'){D.assigned=[];i.value='';$('#res').innerHTML='';$('#asl').innerHTML=''}};
A.ul=v=>{D.unlimited=v;const m=$('#mx');m.disabled=v;if(v){D.maxAttempts='';m.value=''}};A.sa=v=>{D.showAns=v};
A.fs=q=>{const r=$('#res'),s=q.trim().toLowerCase();if(!s){r.innerHTML='';return}const m=U.filter(u=>((u.name||'')+' '+(u.email||'')).toLowerCase().includes(s)&&!D.assigned.some(a=>a.uid==u.id));r.innerHTML=m.map(u=>`<div class=card style="padding:6px;cursor:pointer;margin:4px 0" onclick="A.ad('${u.id}')">${esc(u.name||u.email)} <span class=m>${esc(u.role)}</span></div>`).join('')||'<small class=m>No match</small>'};
A.ad=id=>{const u=U.find(x=>x.id==id);D.assigned.push({uid:id,name:u.name||u.email});draw()};
A.cats=()=>modal(`<h3>Categories</h3>${K.map(k=>`<div class="row sp" style="margin:6px 0"><span>${esc(k.name)}</span><span><button class=g onclick="A.ec('${k.id}')">✏️</button> <button class=r onclick="A.dc('${k.id}')">🗑</button></span></div>`).join('')}<div class=row style="margin-top:10px"><input id=nc placeholder="Add another category"><button onclick="A.ac()">Save</button></div><br><button class=g onclick="A.close()">Close</button>`);
A.ac=async()=>{const n=$('#nc').value.trim();if(!n)return;const r=await addDoc(collection(db,'categories'),{name:n});K.push({id:r.id,name:n});A.cats();draw()};
A.ec=async id=>{const k=K.find(x=>x.id==id),n=prompt('Rename category',k.name);if(n){await updateDoc(doc(db,'categories',id),{name:n});k.name=n;A.cats()}};
A.dc=async id=>{if(confirm('Delete category?')){await deleteDoc(doc(db,'categories',id));K=K.filter(k=>k.id!=id);A.cats()}};
let QT='MCQ';
A.qm=()=>{QT='MCQ';A.qr()};A.qt=v=>{QT=v;A.qr()};
A.qr=()=>modal(`<h3>Add Question</h3><label>Question</label><input id=qq><label>Type</label><select onchange="A.qt(this.value)"><option value=MCQ ${QT=='MCQ'?'selected':''}>Multiple Choice</option><option value=TF ${QT=='TF'?'selected':''}>True or False</option></select>
${(QT=='MCQ'?['A','B','C','D']:['True','False']).map((l,i)=>`<div class=row style="margin-top:6px"><input type=radio name=ca value=${i}>${QT=='MCQ'?`<input style="flex:1" id=o${i} placeholder="Choice ${l}">`:l}</div>`).join('')}<small class=m>Select the correct answer</small><label>Marks</label><input id=mk type=number min=1 value=1><br><br><button onclick="A.qs()">Save</button> <button class=g onclick="A.close()">Cancel</button>`);
A.qs=()=>{const q=$('#qq').value.trim(),c=document.querySelector('[name=ca]:checked'),opts=QT=='MCQ'?[0,1,2,3].map(i=>$('#o'+i).value.trim()):['True','False'];if(!q||!c||opts.some(x=>!x))return alert('Fill in the question, all choices and select the correct answer.');D.questions.push({q,type:QT,opts,ans:+c.value,marks:+$('#mk').value||1});A.close();draw()};
A.save=async st=>{try{await A.sv2(st)}catch(x){console.error(x);alert('Save failed: '+(x.message||x))}};
A.sv2=async st=>{sy();
const tgt=(st=='Published'&&D.touched)?D.setStatus:st;
if(tgt!='Draft'){const L={title:'Course Title',desc:'Course Description',category:'Category',thumb:'Course Thumbnail',duration:'Estimated Duration',difficulty:'Difficulty Level'},bad=Object.keys(L).filter(k=>!String(D[k]||'').trim()).map(k=>L[k]);if(!(D.pass>=1&&D.pass<=100))bad.push('Passing Threshold (1-100)');if(D.questions.length&&!D.unlimited&&!(+D.maxAttempts>=1))bad.push('Max Attempts');if(bad.length){D.err=bad;draw();scrollTo(0,0);alert('Please fill in: '+bad.join(', '));return}D.err=null}
const d={...D};delete d.err;delete d.touched;delete d.setStatus;delete d.policy;delete d.max;d.unlimited=!!D.unlimited;d.showAns=!!D.showAns;d.maxAttempts=D.unlimited?'':(+D.maxAttempts||'');
if(!String(d.title||'').trim())d.title='Untitled draft';
const prev=D.status;
d.status=tgt;d.wasPub=!!D.wasPub||tgt!='Draft';delete d.id;
d.modified=now();d.created=D.created||now();d.lastEditedBy=me.name;d.lastEditedAt=d.modified;
d.log=[...(D.log||[]),{by:me.name,uid:me.uid,at:d.modified,act:(D.id?'Edited':'Created')+' · '+(D.id&&prev!=tgt?prev+' → '+tgt:tgt)}].slice(-LOGMAX);
if(!D.id){d.trainerId=me.uid;d.trainerName=me.name;d.trainerDesig=me.designation||'';d.trainerDept=me.department||''}
let id=D.id;if(id)await setDoc(doc(db,'courses',id),d);else id=(await addDoc(collection(db,'courses'),d)).id;
if(d.vis=='private'&&d.status=='Published')for(const a of d.assigned)if(!E.some(e=>e.id==a.uid+'_'+id))await setDoc(doc(db,'enrollments',a.uid+'_'+id),{uid:a.uid,courseId:id,assignedBy:d.trainerName||me.name,viewed:[]});
A.go('mt')};

/* MANAGE EMPLOYEES */
const empH=()=>`${crumb(['Admin','admin'],['Manage Employees'])}<div class="row sp"><h2>Manage Employees</h2><button onclick="A.em()">+ Add Employee</button></div><div class=card style="overflow:auto"><table><tr><th>Name<th>Email<th>Designation<th>Phone<th>Department<th>Role<th>Status<th>Actions</tr>${U.map(u=>`<tr><td>${esc(u.name)}<td>${esc(u.email)}<td>${esc(u.designation)}<td>${esc(u.phone)}<td>${esc(u.department)}<td>${u.role}<td><span class="tag ${u.status}">${u.status}</span><td><button class=g onclick="A.ev('${u.id}')">👁</button> <button class=g onclick="A.em('${u.id}')">✏️</button> <button class=r onclick="A.ed('${u.id}')">🗑</button></tr>`).join('')}</table></div>`;
const ext=u=>`<label>Designation</label><input id=ds value="${esc(u.designation)}"><label>Phone Number</label><input id=ph value="${esc(u.phone)}"><label>Department</label><input id=dp value="${esc(u.department)}"><label>Role</label>${sel('rl',['Employee','Admin','Super Admin'],u.role||'Employee','')}<label>Status</label>${sel('sx',['Active','Inactive'],u.status||'Active','')}`;
let EID=null;
A.em=id=>{EID=id;const u=id?U.find(x=>x.id==id):null;modal(`<h3>${u?'Edit':'Add'} Employee</h3><label>Name</label><input id=nm value="${esc(u?.name)}">${u?`<label>Email</label><input value="${esc(u.email)}" disabled>`:`<label>Email</label><input id=ea type=email><label>Password</label><input id=ps type=password>`}<div id=x>${u?ext(u):''}</div><br><button id=sv onclick="A.${u?'su':'ce'}()">${u?'Save':'Create account'}</button> <button class=g onclick="A.close();A.go('emp')">Close</button>`)};
A.ce=async()=>{const n=$('#nm').value.trim(),e=$('#ea').value.trim(),p=$('#ps').value;if(!n||!/^[^\s@]+@[^\s@]+\.[A-Za-z]{2,}$/.test(e)||p.length<6)return alert('Enter name, a valid email and a password (min 6 chars).');
try{const s2=initializeApp(cfg,'sec'+now()),a2=getAuth(s2),c=await createUserWithEmailAndPassword(a2,e,p);await setDoc(doc(db,'users',c.user.uid),{name:n,email:e,role:'Employee',status:'Active'});await signOut(a2);EID=c.user.uid}catch(x){return alert(x.message)}
$('#x').innerHTML=ext({});$('#sv').textContent='Save details';$('#sv').setAttribute('onclick','A.su()')};
A.su=async()=>{const d={designation:$('#ds').value,phone:$('#ph').value,department:$('#dp').value,role:$('#rl').value,status:$('#sx').value};if($('#nm'))d.name=$('#nm').value;await updateDoc(doc(db,'users',EID),d);A.close();A.go('emp')};
A.ev=id=>{const u=U.find(x=>x.id==id);modal(`<h3>${esc(u.name)}</h3><p>Email: ${esc(u.email)}</p><p>Phone: ${esc(u.phone)||'-'}</p><p>Designation: ${esc(u.designation)||'-'}</p><p>Department: ${esc(u.department)||'-'}</p><button class=g onclick="A.close()">Close</button>`)};
A.ed=async id=>{if(confirm('Delete this employee?')&&confirm('Are you sure? This cannot be undone.')){await deleteDoc(doc(db,'users',id));A.go('emp')}};

/* EMPLOYEE: MY TRAINING */
const mine=()=>E.filter(e=>e.uid==me.uid).map(e=>({e,c:C.find(c=>c.id==e.courseId)})).filter(x=>x.c&&x.c.status=='Published');
const due=(e,c)=>e.due||c.deadline,over=(e,c,s)=>due(e,c)&&s!='Completed'&&new Date(due(e,c))<new Date();
const contH=l=>`<h3>Continue Training</h3><div class="grid g3">${l.filter(({e,c})=>stt(e,c)!='Completed').sort((a,b)=>(b.e.last||0)-(a.e.last||0)).slice(0,3).map(({e,c})=>{const p=pr(e,c);return `<div class=card><b>${esc(c.title)}</b><div class=m style="margin:6px 0">${p}%</div>${bar(p)}<div style="margin:8px 0">${(c.tags||[]).map(t=>`<span class=tag>${esc(t)}</span>`).join('')}</div><button onclick="A.open('${c.id}')">${p>0?'Resume Course':'Start Course'}</button>${e.assignedBy=='Self-assigned'?` <button class=r onclick="A.un('${c.id}')">Unassign</button>`:''}</div>`}).join('')||'<span class=m>Nothing in progress.</span>'}</div>`;
const myH=()=>{const l=mine(),n=s=>l.filter(({e,c})=>stt(e,c)==s).length,d=n('Completed');
return `<div class="row sp"><div><h2 style="margin:0">My Training</h2><div class=m>Track and complete your learning courses</div></div><button onclick="A.go('browse')">Browse Training</button></div><br><div class="grid g4">${[['Course Completed',d,'✅'],['In Progress',n('In Progress'),'⏳'],['Not Started',n('Not Started'),'📘'],['Completion Rate',(l.length?Math.round(d/l.length*100):0)+'%','📊']].map(([t,v,i])=>`<div class="card row sp"><div><div class=m>${t}</div><h2 style="margin:4px 0">${v}</h2></div><span style="font-size:26px">${i}</span></div>`).join('')}</div>${contH(l)}
<h3>Assigned Training</h3><div class=card style="overflow:auto"><table><tr><th>Title<th>Assigned By<th>Status<th>Due</tr>${l.map(({e,c})=>{const s=stt(e,c);return `<tr><td><a style="cursor:pointer;color:var(--p)" onclick="A.open('${c.id}')">${esc(c.title)}</a><td>${esc(e.assignedBy)}<td><span class="tag ${cls(s)}">${s}</span><td class="${over(e,c,s)?'red':''}">${due(e,c)||'-'}</tr>`}).join('')||'<tr><td colspan=4 class=m>No assigned courses</td></tr>'}</table></div>`};
const browseH=()=>{const l=mine(),q=BF.q.toLowerCase(),r=C.filter(c=>c.status=='Published'&&c.vis=='public'&&(!q||c.title.toLowerCase().includes(q))&&(BF.cat=='All'||c.category==BF.cat));
return `${crumb(['My Training','my'],['Browse Training'])}<h2>Browse Public Course</h2><div class=row><input style="width:260px" placeholder="Search title" value="${esc(BF.q)}" onchange="BF.q=this.value;draw()">${sel('',['All',...K.map(k=>k.name)],BF.cat,"BF.cat=this.value;draw()")}</div><br><div class="grid g3">${r.map(c=>`<div class=card><b>${esc(c.title)}</b><p class=m>${esc(c.desc)}</p>${(()=>{const x=l.find(x=>x.c.id==c.id);return x?`<button class=g onclick="A.open('${c.id}')">Open</button>${x.e.assignedBy=='Self-assigned'?` <button class=r onclick="A.un('${c.id}')">Unassign</button>`:''}`:`<button onclick="A.me('${c.id}')">Assign to Me</button>`})()}<div class=m style="margin-top:8px;font-size:12px">${mats(c).length} materials · ${esc(c.duration)}</div></div>`).join('')||'<span class=m>No public courses.</span>'}</div>${contH(l)}`};
BF.cat='All';
A.me=async id=>{const c=C.find(x=>x.id==id);await setDoc(doc(db,'enrollments',me.uid+'_'+id),{uid:me.uid,courseId:id,assignedBy:'Self-assigned',viewed:[]});A.go('browse')};
A.un=async id=>{const c=C.find(x=>x.id==id);if(!confirm(`Unassign "${c?c.title:'this course'}"?\n\nYour progress, viewed materials, answers and score will be permanently deleted.`))return;if(!confirm('Are you sure? This cannot be undone and your data will not be kept.'))return;
try{await deleteDoc(doc(db,'enrollments',me.uid+'_'+id));A.go(S.v=='my'?'my':'browse')}catch(x){console.error(x);alert('Unassign failed: '+(x.message||x))}};

/* COURSE PAGE */
A.open=async id=>{try{await load();const e=E.find(x=>x.id==me.uid+'_'+id);S={v:'course',a:id,m:null,ans:{...(e?.answers||{})},qm:e&&e.attempted?'result':'take',rv:false};draw()}catch(x){console.error(x);alert('Could not open course: '+(x.message||x))}};
const viewer=m=>{if(!m)return '<div class=m style="padding:40px;text-align:center">Select a material to view</div>';const u=m.url;return /\.(mp4|webm|mov)(\?|$)/i.test(u)?`<video src="${esc(u)}" controls style="width:100%"></video>`:/\.pptx?(\?|$)/i.test(u)?`<iframe src="https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(u)}" style="width:100%;height:480px;border:0"></iframe>`:`<iframe src="${esc(u)}" style="width:100%;height:480px;border:0"></iframe>`};
const courseH=()=>{const c=C.find(x=>x.id==S.a),e=E.find(x=>x.id==me.uid+'_'+S.a);if(!c||!e||c.status!='Published')return '<p>Course not available.</p>';const s=stt(e,c),M=mats(c),cur=M.find(m=>m.id==S.m),qs=c.questions||[];S.ans=S.ans||{};
return `${crumb(['My Training','my'],[esc(c.title)])}<div class="row sp"><h2>${esc(c.title)}</h2><span class="tag ${cls(s)}">${s}</span></div><div class=card>${viewer(cur)}</div>
<div class="grid two"><div><div class=card><b>Overview</b><p>${esc(c.desc)}</p></div><div class=card><b>Materials</b>${M.map(m=>`<div style="padding:5px 0"><a style="cursor:pointer;color:var(--p)" onclick="A.mat('${m.id}')">${(e.viewed||[]).includes(m.id)?'✅':'▶️'} ${esc(m.name)}</a></div>`).join('')||'<span class=m>No materials</span>'}</div>
${qs.length?assessH(c,e):''}</div>
<div><div class=card><b>Trainer</b><p>${esc(c.trainerName)}<br><span class=m>${esc(c.trainerDesig)} · ${esc(c.trainerDept)}</span></p></div><div class=card><b>Course Lessons</b>${(c.sections||[]).map((sc,i)=>`<p><b>${esc(sc.title)}</b><br>${sc.mats.map((m,j)=>`<a style="cursor:pointer;color:var(--p)" onclick="A.mat('${i}.${j}')">• ${esc(m.name)}</a> ${m.tag?`<span class=tag>${esc(m.tag)}</span>`:''}<br>`).join('')}</p>`).join('')}</div></div></div>`};
A.mat=async id=>{S.m=id;const e=E.find(x=>x.id==me.uid+'_'+S.a);if(!(e.viewed||[]).includes(id)){e.viewed=[...(e.viewed||[]),id];e.last=now();await updateDoc(doc(db,'enrollments',e.id),{viewed:e.viewed,last:e.last})}draw()};
const score=c=>{const qs=c.questions;let g=0,t=0;qs.forEach((q,i)=>{t+=q.marks;if(S.ans[i]===q.ans)g+=q.marks});return[g,t]};
A.an=(i,j)=>{S.ans[i]=j;const c=C.find(x=>x.id==S.a);$('#sum').textContent=`${Object.keys(S.ans).length} of ${c.questions.length} Answered`};
const review=(c,ans,showC)=>c.questions.map((q,i)=>{const a=ans[i];return `<div style="margin:12px 0"><b>${i+1}. ${esc(q.q)}</b> <span class=m>(${q.marks})</span>${q.opts.map((o,j)=>{let st='',tx='';if(j===a){const good=a===q.ans;st=good?'background:#dcfce7;color:#166534':'background:#fee2e2;color:#991b1b';tx=good?' ✔ Your answer (correct)':' ✘ Your answer (wrong)'}else if(showC&&j===q.ans){st='border:1px dashed #166534;color:#166534';tx=' ✔ Correct answer'}return `<div style="padding:6px 8px;margin:4px 0;border-radius:6px;border:1px solid transparent;${st}">${esc(o)}<small>${tx}</small></div>`}).join('')}</div>`}).join('');
const assessH=(c,e)=>{const qs=c.questions,p=pcfg(c),at=attemptsOf(e),lim=!p.unl&&p.max>0?p.max:Infinity,tot=qs.reduce((s,q)=>s+(+q.marks||0),0);
if((S.qm||'take')=='take')return `<div class=card><b>Assessment Questions</b> <span class=m>(pass ${c.pass}%${lim<Infinity?` · attempt ${Math.min(at+1,lim)} of ${lim}`:''})</span>${qs.map((q,i)=>`<div style="margin:12px 0"><b>${i+1}. ${esc(q.q)}</b> <span class=m>(${q.marks})</span>${q.opts.map((o,j)=>`<label style="font-weight:400"><input type=radio name=q${i} ${S.ans[i]===j?'checked':''} onchange="A.an(${i},${j})"> ${esc(o)}</label>`).join('')}</div>`).join('')}<div id=sum>${Object.keys(S.ans).length} of ${qs.length} Answered</div><br><button onclick="A.sub()">Submit</button></div>`;
const g=e.score||0,ok=!!e.passed,all=g>=tot,out=at>=lim;
return `<div class=card><b>Assessment Questions</b> <span class=m>(pass ${c.pass}%)</span><p>${qs.length} of ${qs.length} Answered · Total Score: ${g}/${tot} · <b class="${ok?'':'red'}">${ok?'PASSED':'TRY AGAIN'}</b></p>${lim<Infinity?`<p class=m>Attempts used: ${Math.min(at,lim)} of ${lim}</p>`:''}${!ok&&out?'<p class=red>Please contact Admin to reassign this course.</p>':''}<div class=row><button class=g onclick="A.vw()">${S.rv?'Hide Answer':'View Answer'}</button><button ${all||out?'disabled':''} onclick="A.rt()">Retake</button></div>${S.rv?review(c,e.answers||{},p.show):''}</div>`};
A.sub=async()=>{const c=C.find(x=>x.id==S.a),e=E.find(x=>x.id==me.uid+'_'+S.a),n=c.questions.length,p=pcfg(c),at=attemptsOf(e);
if(!p.unl&&p.max>0&&at>=p.max)return alert('You have used all attempts. Please contact Admin to reassign this course.');
if(Object.keys(S.ans).length<n)return alert('Please answer all questions.');
const[g,t]=score(c),ok=Math.round(g/t*100)>=c.pass,ans={...S.ans},na=at+1,l=now();
try{await updateDoc(doc(db,'enrollments',e.id),{answers:ans,score:g,passed:ok,attempted:true,attempts:na,last:l});Object.assign(e,{answers:ans,score:g,passed:ok,attempted:true,attempts:na,last:l});S.qm='result';S.rv=false;draw()}catch(x){console.error(x);alert('Submit failed: '+(x.message||x))}};
A.rt=()=>{const c=C.find(x=>x.id==S.a),e=E.find(x=>x.id==me.uid+'_'+S.a),p=pcfg(c),tot=c.questions.reduce((s,q)=>s+(+q.marks||0),0);if((e.score||0)>=tot||(!p.unl&&p.max>0&&attemptsOf(e)>=p.max))return;S.ans={};S.qm='take';S.rv=false;draw()};
A.vw=()=>{S.rv=!S.rv;draw()};
A.go('login');
</script></body></html>
